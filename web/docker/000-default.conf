<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName kestrel.local
    ServerSignature Off

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploads are served as static files only, never executed.
    <Directory /var/www/html/uploads>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
        AddType text/plain .php .phtml .php3 .php4 .php5 .phar
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
