<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName kestrel.local

    # Server banner left verbose on purpose (recon surface).
    ServerSignature On

    <Directory /var/www/html>
        Options +Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The /uploads dir executes PHP on purpose (upload -> RCE path).
    <Directory /var/www/html/uploads>
        php_admin_flag engine on
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
