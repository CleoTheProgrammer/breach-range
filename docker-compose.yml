# Breach Range (Stage 1): target + console + shared db.
# ISOLATED TRAINING LAB ONLY. Do not expose to any untrusted network.
services:
  target:
    build: ./web
    container_name: kestrel_target
    ports:
      - "${BIND_HOST:-0.0.0.0}:${TARGET_PORT:-8080}:80"
    environment:
      TZ: "Africa/Johannesburg"
      DB_HOST: db
      DB_NAME: kestrel
      DB_USER: kestrel_app
      DB_PASS: Summer2023!        # intentionally weak, part of the scenario
      APP_STAGE: "1"
      FLAG_PEPPER: "kestrel-stage1-pepper-change-me"   # shared with console, NOT given to players
    depends_on:
      db:
        condition: service_healthy
    networks: [range]

  console:
    build: ./console
    container_name: range_console
    ports:
      - "${BIND_HOST:-0.0.0.0}:${CONSOLE_PORT:-8081}:80"
    environment:
      TZ: "Africa/Johannesburg"
      DB_HOST: db
      DB_NAME: console
      DB_USER: console_app
      DB_PASS: console-strong-pw
      TARGET_URL: "http://${PUBLIC_HOST:-127.0.0.1}:${TARGET_PORT:-8080}"
      FLAG_PEPPER: "kestrel-stage1-pepper-change-me"   # must match target
      INSTRUCTOR_PASSWORD: "${INSTRUCTOR_PASSWORD:-change-me-instructor}"
      AUDIT_SECRET: "${AUDIT_SECRET:-change-me-audit-secret}"
    depends_on:
      db:
        condition: service_healthy
    networks: [range]

  db:
    image: mysql:8.0
    command: --default-time-zone=+02:00
    container_name: range_db
    environment:
      TZ: "Africa/Johannesburg"
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/10-console.sql:/docker-entrypoint-initdb.d/10-console.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [range]

networks:
  range:
    driver: bridge
