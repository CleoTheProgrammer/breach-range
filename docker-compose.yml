# Hardened branch: the fixed target only, for diffing against main and confirming
# the Stage 1 exploits no longer work. No console (nothing to capture here).
services:
  target:
    build: ./web
    container_name: kestrel_target_hardened
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_NAME: kestrel
      DB_USER: kestrel_app
      DB_PASS: Summer2023!
      APP_STAGE: "1"
    depends_on:
      db:
        condition: service_healthy
    networks: [range]

  db:
    image: mysql:8.0
    container_name: kestrel_db_hardened
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./db/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [range]

networks:
  range:
    driver: bridge
